# Lint for real bugs only (pyflakes and the syntax/statement pycodestyle rules), tuned to the
# current code: no formatter is enforced and the code's existing style is left alone.
target-version = "py312"
line-length = 140

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E731", # lambda assignment: used deliberately for short local helpers
  "E741", # ambiguous names (l, I, O): used as short loop variables
]

[lint.per-file-ignores]
# Known findings in code carried over from content_buddy; fix in a follow-up, then drop these.
"plugins/pipeline/scripts/absence-only.py" = ["F811"]
"plugins/pipeline/scripts/pipeline.py" = ["F541"]
