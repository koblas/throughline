# The user documentation, built by Zensical (https://zensical.org), which reads
# this MkDocs-format file, and published to GitHub Pages by
# .github/workflows/docs.yml. Build locally: make docs (or make docs-serve).
#
# The site follows the Divio documentation system (https://docs.divio.com/documentation-system/):
# Start here (tutorials), Concepts (explanation), Guides (how-to) and Reference.
# .claude/skills/docs/SKILL.md says which quadrant a change belongs in;
# docs/check.py checks the reference pages against the plugin.
site_name: throughline
site_description: A Claude Code plugin marketplace carrying pipeline, a scenario-first TDD agent pipeline.
site_url: https://koblas.github.io/throughline/
repo_url: https://github.com/koblas/throughline
repo_name: koblas/throughline
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: out/site
exclude_docs: |
  check.py

theme:
  name: material
  variant: modern
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Start here:
      - index.md
  - Concepts:
      - concepts/index.md
      - How the pipeline works: concepts/how-the-pipeline-works.md
  - Guides:
      - guides/index.md
      - Install:
          - How to install the plugin: guides/install/install.md
          - How to update the plugin: guides/install/update.md
      - Configure a repo:
          - How to configure a repo: guides/configure/configure-a-repo.md
          - How to start a new repo: guides/configure/new-repo.md
      - Develop:
          - How to set up for development: guides/develop/dev-environment.md
          - How to write documentation: guides/develop/docs.md
  - Reference:
      - reference/index.md
      - Commands: reference/commands.md
      - Agents: reference/agents.md
      - Skills: reference/skills.md
      - pipeline.json: reference/pipeline-json.md
