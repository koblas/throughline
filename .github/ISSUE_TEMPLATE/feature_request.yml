name: Feature request
description: Suggest a change to the pipeline, its agents, commands or scripts.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen instead.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
