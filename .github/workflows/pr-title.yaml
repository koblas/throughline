name: "pr-title"

# Pull requests are squash-merged with their title as the commit message, and release-please
# builds the changelog and the next version from those messages, so every PR title must be a
# Conventional Commit: `<type>[(scope)][!]: <subject>`.
#
# pull_request_target so the check also runs for PRs from forks. It never checks out or runs
# the PR's code; it only reads the title through the API.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Keep in sync with changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            chore
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the title "{title}" should start with a lowercase letter.
