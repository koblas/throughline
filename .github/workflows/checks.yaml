name: "checks"

# Every pull request and push to main:
#
# - manifests: the marketplace, plugin and hooks manifests parse, `claude plugin validate .`
#   passes, and plugin.json's "version" matches version.txt (release-please bumps both).
# - lint: ruff with the repo's ruff.toml (bug-finding rules only; no formatter is enforced).
# - test: the full unittest suite on every supported Python. The tests fake every toolchain they
#   touch (`go`, `npx`, linters: plugins/pipeline/tests/fakes.py), so only git is needed, with
#   an identity for the scratch repos. No test skips.
#   The code needs Python 3.12+ (f-string syntax), so 3.10 and 3.11 are not in the matrix.
# - docs: `make docs`: docs/check.py (the reference pages cover every command, agent, skill and
#   pipeline.json key; every page is in the nav) and the strict Zensical build (no broken links).
#   docs.yml publishes the same build from main.
#
# A pull request that changes only the files release-please bumps starts no run. That is the
# release PR: it is opened by github-actions[bot], and GitHub holds every run that bot starts
# until someone approves it (a job-level `if` does not help, since the hold comes first). The
# push to main that merging it makes runs every job, including the version match above.

on:
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
      - plugins/pipeline/.claude-plugin/plugin.json
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Manifests parse
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/pipeline/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool plugins/pipeline/hooks/hooks.json > /dev/null
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null
      - name: plugin.json version matches version.txt
        run: |
          plugin=$(python3 -c 'import json; print(json.load(open("plugins/pipeline/.claude-plugin/plugin.json"))["version"])')
          file=$(tr -d '[:space:]' < version.txt)
          if [ "$plugin" != "$file" ]; then
            echo "::error file=plugins/pipeline/.claude-plugin/plugin.json::version $plugin does not match version.txt ($file)"
            exit 1
          fi
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: |
          claude plugin validate .
          claude plugin validate plugins/pipeline

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # ruff-action publishes only full-version tags (no floating major), so it is pinned exactly;
      # dependabot bumps it with the other actions.
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.5"
          args: check --output-format=github

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Git identity for the scratch repos the tests create
        run: |
          git config --global user.name "throughline-ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global init.defaultBranch main
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        # Sharded over one worker process per CPU; a failing shard prints its whole output.
        run: python plugins/pipeline/tests/run.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes full-version tags only, so it is pinned exactly; dependabot bumps it.
      - uses: astral-sh/setup-uv@v10.3.2
      - run: make docs
